app-id: io.github.tobagin.scramble
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: scramble
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

cleanup:
  - /include
  - /lib/cmake
  - /lib/girepository-1.0
  - /share/gir-1.0
  - /share/man
  - /share/vala
  - "*.a"

modules:
  - name: inih
    buildsystem: meson
    config-opts:
      - -Ddistro_install=true
      - -Dwith_INIReader=true
    sources:
      - type: git
        url: https://github.com/benhoyt/inih.git
        tag: r62
        commit: 26254ee9de7681f8825433415443e7116ff24b98

  - name: exiv2
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DEXIV2_ENABLE_NLS=ON
      - -DEXIV2_BUILD_SAMPLES=OFF
      - -DEXIV2_BUILD_EXIV2_COMMAND=OFF
      - -DEXIV2_ENABLE_BMFF=ON
      - -DCMAKE_CXX_FLAGS=-Wno-format
    sources:
      - type: git
        url: https://github.com/Exiv2/exiv2.git
        tag: v0.28.9
        commit: 110cbaef8e75f0e064e5c522846a18982bc4db70

  - name: libde265
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_DECODER=ON
      - -DENABLE_ENCODER=OFF
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    cleanup:
      - /bin
    sources:
      - type: git
        url: https://github.com/strukturag/libde265.git
        tag: v1.1.3
        commit: ba62bf4cfb3242f3bf0a45617ff09e35236e4d82

  - name: libheif
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DWITH_LIBDE265=ON
      - -DWITH_X265=OFF
      - -DWITH_AOM_DECODER=OFF
      - -DWITH_AOM_ENCODER=OFF
      - -DCMAKE_DISABLE_FIND_PACKAGE_AOM=TRUE
      - -DWITH_JPEG_DECODER=ON
      - -DWITH_JPEG_ENCODER=OFF
      - -DENABLE_PLUGIN_LOADING=OFF
    cleanup:
      - /bin
      - /share/thumbnailers
    sources:
      - type: git
        url: https://github.com/strukturag/libheif.git
        tag: v1.23.5
        commit: 413e2a87e6a70b3eccc3a3adc5801179dd2d9e00

  - name: gexiv2
    buildsystem: meson
    config-opts:
      - -Dpython3=false
      - -Dvapi=true
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/gexiv2.git
        tag: "0.16.2"
        commit: 140caa641ffdf4df415c41fa43541d34f1e6c46a

  - name: scramble
    buildsystem: meson
    config-opts:
      - -Dprofile=stable
    sources:
      - type: git
        url: https://github.com/tobagin/scramble.git
        tag: v1.4.5
        commit: 6cbfc3f8955f965880e6a80cb057bac9b125d983
